# 镜像同步工作流：将境外镜像批量同步到私有仓库
name: Image Sync

# 并发控制：同一组workflow不取消正在运行任务
concurrency:
  group: image-sync-main
  cancel-in-progress: false

# 触发规则
on:
  push:
    branches: [ main ]
    paths: [ 'images.yaml' ] # 仅镜像清单文件变更触发
  workflow_dispatch: # 支持手动点击运行
  schedule:
    - cron: '30 8 * * *' # UTC时间，每日8:30定时执行

jobs:
  sync-images:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 最长运行6小时
    permissions:
      contents: read
    env:
      CONCURRENCY: 2      # 并行数量，大镜像多建议改为1，降低瞬时磁盘压力
      RETRIES: 3          # 拉取/推送重试次数
      SLEEP_RETRY: 2      # 重试间隔(秒)
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install crane binary(for manifest check only)
        run: |
          set -e
          VERSION="v0.20.0"
          curl -sL "https://github.com/google/go-containerregistry/releases/download/${VERSION}/go-containerregistry_Linux_x86_64.tar.gz" -o crane.tar.gz
          tar -zxvf crane.tar.gz crane
          chmod +x crane
          sudo mv crane /usr/local/bin/
          crane version

      - name: Login to Private Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Deep clean runner disk
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet
          docker system prune -af
          docker builder prune -af
          df -h

      - name: Run mirror sync(app.sh)
        run: |
          chmod +x ./app.sh
          ./app.sh
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
          NAMESPACE: ${{ secrets.REGISTRY_NAMESPACE }}

      - name: Check Sync Result
        run: |
          if [ -s failed.log ]; then
            echo "❌ 检测到镜像同步失败"
            exit 1
          fi

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-logs
          path: |
            succeeded.log
            skipped.log
            failed.log
          retention-days: 7 # 日志保留7天
