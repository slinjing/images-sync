name: Image Sync
concurrency:
  group: image-sync-main
  cancel-in-progress: false

on:
  push:
    branches: [ main ]
    paths: [ 'images.yaml' ]
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * *'

jobs:
  sync-images:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      CONCURRENCY: 2  
      RETRIES: 3
      SLEEP_RETRY: 2
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install crane binary(for manifest check only)
        run: |
          set -e
          VERSION="v0.20.0"
          curl -sL "https://github.com/google/go-containerregistry/releases/download/${VERSION}/go-containerregistry_Linux_x86_64.tar.gz" -o crane.tar.gz
          tar -zxvf crane.tar.gz crane
          chmod +x crane
          sudo mv crane /usr/local/bin/
          crane version

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Deep clean runner disk
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker system prune -af
          docker builder prune -af
          df -h

      - name: Run mirror sync(app.sh)
        run: |
          chmod +x ./app.sh
          ./app.sh
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
          NAMESPACE: ${{ secrets.REGISTRY_NAMESPACE }}

      - name: Check Sync Result
        run: |
          if [ -s failed.log ]; then
            echo "❌ 检测到镜像同步失败"
            exit 1
          fi

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-logs
          path: |
            succeeded.log
            skipped.log
            failed.log
          retention-days: 7
