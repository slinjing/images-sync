name: Image Sync
concurrency:
  group: image-sync-main
  cancel-in-progress: false

on:
  push:
    branches: [ main ]
    paths: [ 'images.yaml' ]
  workflow_dispatch:
  schedule:
    - cron: '30 16 * * *'

jobs:
  sync-images:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      CONCURRENCY: 4
      RETRIES: 3
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install crane (OCI image copy tool)
        run: |
          set -e
          curl -sL https://github.com/google/go-containerregistry/releases/latest/download/crane-linux-amd64 > crane
          chmod +x crane
          sudo mv crane /usr/local/bin/crane
          crane version

      - name: Prepare registry auth file for crane
        run: |
          cat > ~/.docker/config.json <<EOF
          {
            "auths": {
              "${{ secrets.REGISTRY }}": {
                "auth": "$(echo -n "${{ secrets.REGISTRY_USER }}:${{ secrets.REGISTRY_PASSWORD }}" | base64)"
              }
            }
          }
          EOF

      - name: Run mirror sync
        run: |
          chmod +x ./app.sh
          ./app.sh
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
          NAMESPACE: ${{ secrets.REGISTRY_NAMESPACE }}

      - name: Check Sync Result
        run: |
          if [ -s failed.log ]; then
            echo "❌ 检测到镜像同步失败"
            exit 1
          fi

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-logs
          path: |
            succeeded.log
            failed.log
          retention-days: 7
