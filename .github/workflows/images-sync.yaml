name: Image Sync
on:
  push:
    branches: [ main ]
    paths: [ 'images.yaml' ]  # images.yaml变更触发
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'  # UTC 16点 = 北京时间0点

jobs:
  sync-images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps: 
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Sync Images
        run: |
          chmod +x ./app.sh
          ./app.sh
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
          NAMESPACE: ${{ secrets.REGISTRY_NAMESPACE }}
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-logs
          path: |
            succeeded.log
            failed.log
          retention-days: 7
      - name: Notify Result
        if: always()
        run: |
          export GITHUB_TOKEN=""  
          success_count=$(wc -l < succeeded.log)
          fail_count=$(wc -l < failed.log)
          echo "==== 镜像同步统计 ===="
          echo "✅ 成功：${success_count}"
          echo "❌ 失败：${fail_count}"
          if [ -s failed.log ]; then
            echo -e "\n❌ 失败镜像列表："
            cat failed.log
          else
            echo -e "\n✅ 全部镜像同步成功"
          fi
