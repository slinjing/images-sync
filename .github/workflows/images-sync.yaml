name: Image Sync
on:
  push:
    branches: [ main ]
    paths: [ 'images.yaml' ]
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'

jobs:
  sync-images:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    steps: 
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
          
      - name: Clean runner disk space
        run: |
          sudo apt-get clean
          docker system prune -af

      - name: Sync Images
        run: |
          chmod +x ./app.sh
          ./app.sh
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
          NAMESPACE: ${{ secrets.REGISTRY_NAMESPACE }}

      - name: Sync Images
        run: |
          chmod +x ./app.sh
          ./app.sh
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
          NAMESPACE: ${{ secrets.REGISTRY_NAMESPACE }}
      - name: Check Sync Result
        run: |
          if [ -s failed.log ]; then
            echo "❌ 检测到镜像同步失败，标记Job失败"
            exit 1
          fi
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-logs
          path: |
            succeeded.log
            failed.log
          retention-days: 7
